<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f5f8f6"><meta name="description" content="EarlyPass — arrive early, unlock something special together.">
<title>EarlyPass — Secure classroom attendance</title>
<link rel="icon" href="./favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="./secure.css">
</head>
<body><div id="app" aria-live="polite"><main class="login-wrap"><section class="login-panel"><div class="login-card" id="earlypass-startup"><div class="eyebrow">EARLYPASS · SECURE CLASSROOM</div><h1>Starting EarlyPass…</h1><p id="earlypass-startup-message">Loading your sign-in screen.</p><button class="primary wide" id="earlypass-reload" type="button" hidden>Reload app</button></div></section></main></div>
<script>
(()=>{const show=message=>{const box=document.getElementById('earlypass-startup');if(!box)return;const text=document.getElementById('earlypass-startup-message');if(text)text.textContent='EarlyPass could not start: '+String(message||'a script failed to load.');const button=document.getElementById('earlypass-reload');if(button)button.hidden=false};window.addEventListener('error',event=>show(event.message||'a script failed to load.'),true);window.addEventListener('unhandledrejection',event=>show(event.reason?.message||event.reason||'a startup request failed.'));setTimeout(()=>{if(document.getElementById('earlypass-startup'))show('the app is taking longer than expected. Check your connection, then reload.')},12000);document.addEventListener('click',event=>{if(event.target.id==='earlypass-reload')location.reload()})})();
</script>
<script src="./supabase/config.js"></script>
<script type="module" src="./production.js?v=32"></script>
<script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js").catch(()=>{});</script></body></html>
